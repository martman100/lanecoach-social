name: Render social assets

on:
  push:
    paths:
      - 'designs/**/*.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Render PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          find designs -type f -name '*.svg' -print0 | while IFS= read -r -d '' file; do
            rel="${file#designs/}"
            out="rendered/${rel%.svg}.png"
            mkdir -p "$(dirname "$out")"
            rsvg-convert -w 1080 -h 1080 "$file" -o "$out"
            echo "Rendered $file -> $out"
          done

      - name: Commit rendered assets
        shell: bash
        run: |
          if git diff --quiet -- rendered && [ -z "$(git ls-files --others --exclude-standard rendered)" ]; then
            echo "No rendered changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rendered
          git commit -m "chore: render social media PNG assets"
          git push
